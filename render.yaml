services:
  # Backend: API Laravel (Docker Container)
  - type: web
    name: alertsync-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: APP_NAME
        value: "Alert Sync"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: aws-1-us-east-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres.anqmzxasyjflalxjvuxu
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: RUN_MIGRATIONS
        value: "true"
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync

  # Frontend: Vue 3 Single Page Application (Static Site)
  - type: web
    name: alertsync-frontend
    runtime: static
    rootDir: frontend-vue
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

